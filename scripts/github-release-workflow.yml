name: Publish Antigravity Presence Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Core Dependencies & Build Extension
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx @vscode/vsce package --no-dependencies

      - name: Build Windows Desktop App (.exe Installer & Portable)
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win --x64 --publish never

      - name: Publish GitHub Release with Changelog & Binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            desktop-app/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
