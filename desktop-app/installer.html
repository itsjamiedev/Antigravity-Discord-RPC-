<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080A10;
      --glass-card: rgba(16, 20, 32, 0.64);
      --glass-row: rgba(255, 255, 255, 0.045);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.24);
      --acc: #FFB84D;
      --emerald: #34F5A4;
      --cyan: #38E4FF;
      --coral: #FF5E7E;
      --t1: #F8FAFC;
      --t2: rgba(248, 250, 252, 0.72);
      --t3: rgba(248, 250, 252, 0.44);
      --font-mc: 'Minecraft', 'Minecraft Seven', 'Minecraftia', 'Silkscreen', 'Geist Mono', monospace;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 18%, rgba(56, 228, 255, 0.12) 0%, transparent 48%),
        radial-gradient(circle at 82% 14%, rgba(255, 184, 77, 0.12) 0%, transparent 50%),
        var(--bg);
      color: var(--t1);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .deck-shell {
      width: 100%;
      height: 100%;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px 20px;
      gap: 12px;
    }

    /* Draggable Top Header */
    .top-bar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mc);
      font-size: 13px;
      color: var(--t1);
    }

    .version-tag {
      font-size: 9.5px;
      font-family: var(--font-mc);
      color: var(--acc);
      background: rgba(255, 184, 77, 0.12);
      border: 1px solid rgba(255, 184, 77, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 2px;
    }

    .close-btn {
      -webkit-app-region: no-drag;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--glass-border);
      background: var(--glass-row);
      color: var(--t2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .close-btn:hover {
      border-color: var(--coral);
      color: var(--coral);
      background: rgba(255, 94, 126, 0.12);
    }

    /* Mascot + IDE Detection Glass Hero Row */
    .hero-glass {
      background: var(--glass-card);
      backdrop-filter: blur(22px) saturate(175%);
      -webkit-backdrop-filter: blur(22px) saturate(175%);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mascot-box {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .mascot-img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
      animation: agFloat 2.8s ease-in-out infinite;
    }

    .hero-info {
      min-width: 0;
    }

    .hero-name {
      font-family: var(--font-mc);
      font-size: 12.5px;
      color: var(--t1);
    }

    .hero-path {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--t3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 225px;
      margin-top: 3px;
    }

    .status-pill {
      font-family: var(--font-mc);
      font-size: 9.5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(52, 245, 164, 0.12);
      border: 1px solid rgba(52, 245, 164, 0.35);
      color: var(--emerald);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact Single-Line Glass Toggle Rows */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .glass-toggle-row {
      background: var(--glass-row);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 11px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .glass-toggle-row:hover {
      border-color: var(--glass-border-hover);
      background: rgba(255, 255, 255, 0.07);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-icon {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--acc);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .row-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--t1);
    }

    .glass-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .glass-check:checked {
      background: var(--emerald);
      border-color: var(--emerald);
    }

    .glass-check:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 4.5px;
      height: 8.5px;
      border: solid #06080E;
      border-width: 0 2.2px 2.2px 0;
      transform: rotate(45deg);
    }

    /* Footer: Progress Bar + Primary CTA (Zero Clipping) */
    .footer-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--t2);
    }

    .progress-pct {
      font-family: var(--font-mc);
      font-size: 10px;
      color: var(--emerald);
    }

    .stepped-bar {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 3px;
      height: 7px;
      padding: 1.5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
    }

    .step-cell {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      transition: background 0.12s ease;
    }

    .step-cell.lit {
      background: var(--emerald);
      box-shadow: 0 0 6px rgba(52, 245, 164, 0.6);
    }

    .install-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(52, 245, 164, 0.45);
      background: linear-gradient(180deg, rgba(52, 245, 164, 0.22) 0%, rgba(52, 245, 164, 0.12) 100%);
      backdrop-filter: blur(16px);
      color: var(--emerald);
      font-family: var(--font-mc);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      box-shadow: 0 8px 22px -6px rgba(52, 245, 164, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.16s ease;
    }

    .install-btn:hover:not(:disabled) {
      background: var(--emerald);
      color: #06080E;
      transform: translateY(-1px);
    }

    .install-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    @keyframes agFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3.5px); }
    }
  </style>
</head>
<body>
  <div class="deck-shell">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34F5A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 19 2 19" />
        </svg>
        <span>Antigravity Presence Setup</span>
        <span class="version-tag">v2.3</span>
      </div>
      <button class="close-btn" onclick="closeSetupWindow()" title="Close">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
    </div>

    <!-- Mascot & Detected IDE Glass Hero -->
    <div class="hero-glass">
      <div class="hero-left">
        <div class="mascot-box" onclick="chirpMascot()">
          <img class="mascot-img" src="../resources/mascot.png" alt="Antigravity Mascot" draggable="false" />
        </div>
        <div class="hero-info">
          <div class="hero-name" id="detectTitle">Antigravity 2.0 IDE</div>
          <div class="hero-path" id="detectPath">~/.antigravity-ide/extensions</div>
        </div>
      </div>
      <span class="status-pill" id="detectBadge">Ready</span>
    </div>

    <!-- 4 Compact Single-Line Glass Toggles -->
    <div class="options-stack">
      <label class="glass-toggle-row">
        <div class="row-left">
          <div class="row-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.5 2.5h3v2.5h4v4h-2.5v3h-4v2.5h-4v-4H5.5v-4h1V2.5z" />
            </svg>
          </div>
          <span class="row-label">Install Antigravity IDE Extension</span>
        </div>
        <input type="checkbox" class="glass-check" id="chkInstallExt" checked />
      </label>

      <label class="glass-toggle-row">
        <div class="row-left">
          <div class="row-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="2" y="4.5" width="12" height="7" rx="3.5" />
            </svg>
          </div>
          <span class="row-label">Enable Liquid Glass Dynamic Notch</span>
        </div>
        <input type="checkbox" class="glass-check" id="chkEnableNotch" checked />
      </label>

      <label class="glass-toggle-row">
        <div class="row-left">
          <div class="row-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <path d="M8 2.5L2.5 13h11L8 2.5z" />
            </svg>
          </div>
          <span class="row-label">Enable Desktop Mascot Companion</span>
        </div>
        <input type="checkbox" class="glass-check" id="chkEnableMascot" checked />
      </label>

      <label class="glass-toggle-row">
        <div class="row-left">
          <div class="row-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M8 2v6M4.2 4.2a5.5 5.5 0 1 0 7.6 0" />
            </svg>
          </div>
          <span class="row-label">Launch at Windows Login</span>
        </div>
        <input type="checkbox" class="glass-check" id="chkAutoStart" checked />
      </label>
    </div>

    <!-- Footer Progress & Install CTA -->
    <div class="footer-area">
      <div class="progress-header">
        <span id="progressStepText">Ready to install</span>
        <span class="progress-pct" id="progressPctText">0%</span>
      </div>
      <div class="stepped-bar" id="steppedBar"></div>
      <button class="install-btn" id="btnPunchInstall" onclick="runInstall()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5l3.5 3.5L13 5" />
        </svg>
        <span id="btnPunchLabel">Install &amp; Launch</span>
      </button>
    </div>
  </div>

  <script>
    (function() {
      let ctx = null;
      function getCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume().catch(function() {});
        return ctx;
      }
      function tone(freq, type, startSec, durSec, gainVal) {
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, c.currentTime + startSec);
        g.gain.setValueAtTime(gainVal || 0.032, c.currentTime + startSec);
        g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + startSec + durSec);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(c.currentTime + startSec);
        osc.stop(c.currentTime + startSec + durSec);
      }
      window.installerAudio = {
        step: function(idx) { tone(420 + idx * 28, 'triangle', 0, 0.04, 0.025); },
        fanfare: function() {
          tone(523.25, 'triangle', 0, 0.06, 0.035);
          tone(659.25, 'triangle', 0.06, 0.06, 0.035);
          tone(783.99, 'triangle', 0.12, 0.06, 0.035);
          tone(1046.5, 'square', 0.18, 0.14, 0.04);
        }
      };
    })();

    const bridge = window.antigravityDesktop;
    const barEl = document.getElementById('steppedBar');
    const TOTAL_STEPS = 16;

    for (let i = 0; i < TOTAL_STEPS; i++) {
      const cell = document.createElement('div');
      cell.className = 'step-cell';
      cell.id = 'step-cell-' + i;
      barEl.appendChild(cell);
    }

    function setProgress(stepCount, label) {
      for (let i = 0; i < TOTAL_STEPS; i++) {
        const cell = document.getElementById('step-cell-' + i);
        if (cell) cell.classList.toggle('lit', i < stepCount);
      }
      const pct = Math.min(100, Math.round((stepCount / TOTAL_STEPS) * 100));
      document.getElementById('progressPctText').innerText = pct + '%';
      if (label) document.getElementById('progressStepText').innerText = label;
    }

    function chirpMascot() {
      window.installerAudio.fanfare();
    }

    async function inspectIdeTargets() {
      try {
        const res = await fetch('http://127.0.0.1:41177/api/ide-status');
        if (res.ok) {
          const report = await res.json();
          const detected = (report.targets || []).find(function(t) { return t.detected; }) || (report.targets && report.targets[0]);
          if (detected && detected.detected) {
            document.getElementById('detectTitle').innerText = detected.label;
            document.getElementById('detectPath').innerText = detected.extensionInstallDir;
            document.getElementById('detectBadge').innerText = detected.installed && detected.bundleHashMatch ? 'Synced' : 'Detected';
          } else {
            document.getElementById('detectTitle').innerText = 'Antigravity Standalone';
            document.getElementById('detectPath').innerText = 'Auto-links when IDE is installed';
            document.getElementById('detectBadge').innerText = 'Ready';
          }
        }
      } catch {}
    }

    async function runInstall() {
      const btn = document.getElementById('btnPunchInstall');
      const lbl = document.getElementById('btnPunchLabel');
      btn.disabled = true;

      const installExt = document.getElementById('chkInstallExt').checked;
      const enableNotch = document.getElementById('chkEnableNotch').checked;
      const enableMascot = document.getElementById('chkEnableMascot').checked;
      const autoStart = document.getElementById('chkAutoStart').checked;

      lbl.innerText = 'Installing...';

      const stages = [
        { step: 4, text: 'Detecting Antigravity IDE...' },
        { step: 8, text: 'Provisioning extension bundle...' },
        { step: 12, text: 'Updating extensions.json...' },
        { step: 15, text: 'Applying Liquid Glass Notch & Mascot...' },
        { step: 16, text: 'Complete' }
      ];

      for (let i = 0; i < stages.length; i++) {
        const st = stages[i];
        setProgress(st.step, st.text);
        window.installerAudio.step(st.step);

        if (i === 1 && installExt) {
          try {
            await fetch('http://127.0.0.1:41177/api/ide-install', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ force: true })
            });
          } catch {}
        }

        if (i === 3) {
          try {
            await fetch('http://127.0.0.1:41177/api/companion', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                enabled: enableNotch || enableMascot,
                notchEnabled: enableNotch,
                mascotEnabled: enableMascot
              })
            });
          } catch {}
          if (bridge && typeof bridge.completeSetup === 'function') {
            bridge.completeSetup({
              installExtension: installExt,
              enableOverlay: enableNotch || enableMascot,
              notchEnabled: enableNotch,
              mascotEnabled: enableMascot,
              autoStart: autoStart
            });
          }
        }

        await new Promise(function(r) { setTimeout(r, 200); });
      }

      window.installerAudio.fanfare();
      document.getElementById('detectBadge').innerText = 'Synced';
      lbl.innerText = 'Launching...';

      setTimeout(function() {
        closeSetupWindow();
      }, 650);
    }

    function closeSetupWindow() {
      if (bridge && typeof bridge.closeInstaller === 'function') {
        bridge.closeInstaller();
      } else {
        window.close();
      }
    }

    inspectIdeTargets();
  </script>
</body>
</html>
