<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Apple Liquid Glass / Frosted Obsidian Approximation (per design-taste-frontend Section 2.B) */
      --glass-island: linear-gradient(180deg, rgba(11, 14, 22, 0.88) 0%, rgba(6, 8, 13, 0.94) 100%);
      --glass-panel: rgba(14, 18, 28, 0.72);
      --glass-pill: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-border-strong: rgba(255, 255, 255, 0.26);
      --acc: #FFB84D;
      --emerald: #34F5A4;
      --cyan: #38E4FF;
      --coral: #FF5E7E;
      --t1: #F8FAFC;
      --t2: rgba(248, 250, 252, 0.74);
      --t3: rgba(248, 250, 252, 0.45);
      --font-mc: 'Minecraft', 'Minecraft Seven', 'Minecraftia', 'Silkscreen', 'Geist Mono', monospace;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', Consolas, monospace;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--font-sans);
      color: var(--t1);
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
    }

    .interactive-hitbox {
      pointer-events: auto;
    }

    /* ================================================================== */
    /*  1. APPLE-STYLE LIQUID GLASS DYNAMIC ISLAND NOTCH (TOP-CENTER)     */
    /* ================================================================== */
    .ag-notch-wrapper {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.26s var(--spring), transform 0.28s var(--spring);
    }

    .ag-notch-wrapper.hidden {
      opacity: 0;
      transform: translate(-50%, -140%) scale(0.92);
      pointer-events: none !important;
    }

    .ag-notch-pill {
      background: var(--glass-island);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px 12px;
      min-width: 196px;
      box-shadow:
        0 12px 32px -6px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition:
        min-width 0.32s var(--spring),
        border-radius 0.32s var(--spring),
        padding 0.32s var(--spring),
        border-color 0.22s ease,
        box-shadow 0.26s ease;
    }

    .ag-notch-pill:hover,
    .ag-notch-pill.expanded {
      border-color: var(--glass-border-strong);
      border-radius: 22px;
      min-width: 364px;
      padding: 10px 14px 12px;
      box-shadow:
        0 18px 42px -6px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        0 0 22px rgba(52, 245, 164, 0.12);
    }

    .ag-notch-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ag-notch-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .ag-notch-mascot-thumb {
      width: 21px;
      height: 21px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
    }

    .ag-notch-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      flex-shrink: 0;
    }

    .ag-notch-led.idle {
      background: var(--acc);
      box-shadow: 0 0 6px var(--acc);
    }

    .ag-notch-led.offline {
      background: var(--coral);
      box-shadow: 0 0 6px var(--coral);
    }

    .ag-notch-status {
      font-family: var(--font-mc);
      font-size: 10px;
      color: var(--t1);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .ag-notch-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .ag-notch-model {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--acc);
      padding: 1.5px 7px;
      border-radius: 999px;
      background: rgba(255, 184, 77, 0.12);
      border: 1px solid rgba(255, 184, 77, 0.26);
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ag-notch-timer {
      font-family: var(--font-mc);
      font-size: 9.5px;
      color: var(--emerald);
    }

    /* Expanded Liquid Glass Drawer */
    .ag-notch-drawer {
      display: none;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-direction: column;
      gap: 8px;
    }

    .ag-notch-pill:hover .ag-notch-drawer,
    .ag-notch-pill.expanded .ag-notch-drawer {
      display: flex;
    }

    .ag-notch-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .ag-notch-metric {
      background: var(--glass-pill);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 5px 6px;
      text-align: center;
    }

    .ag-notch-metric .lbl {
      font-size: 9px;
      font-weight: 600;
      color: var(--t3);
    }

    .ag-notch-metric .val {
      font-family: var(--font-mc);
      font-size: 10.5px;
      color: var(--t1);
      margin-top: 2px;
    }

    .ag-notch-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .ag-glass-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      padding: 5px 6px;
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      color: var(--t1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.16s ease;
    }

    .ag-glass-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .ag-glass-btn.active {
      color: var(--emerald);
      border-color: rgba(52, 245, 164, 0.35);
      background: rgba(52, 245, 164, 0.1);
    }

    .ag-glass-btn.danger:hover {
      color: var(--coral);
      border-color: rgba(255, 94, 126, 0.45);
      background: rgba(255, 94, 126, 0.12);
    }

    /* ================================================================== */
    /*  2. AUTHENTIC PNG DESKTOP MASCOT PET & LIQUID GLASS POPOVER        */
    /* ================================================================== */
    .ag-mascot-actor {
      position: fixed;
      z-index: 9998;
      width: 100px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: opacity 0.24s ease;
    }

    .ag-mascot-actor:active {
      cursor: grabbing;
    }

    .ag-mascot-actor.hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    .ag-mascot-bubble {
      position: absolute;
      bottom: 98px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-panel);
      backdrop-filter: blur(18px) saturate(175%);
      -webkit-backdrop-filter: blur(18px) saturate(175%);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 3.5px 10px;
      font-family: var(--font-mc);
      font-size: 9px;
      color: var(--t1);
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .ag-mascot-menu {
      position: absolute;
      bottom: 124px;
      left: 50%;
      transform: translateX(-50%);
      width: 192px;
      background: rgba(12, 16, 25, 0.86);
      backdrop-filter: blur(24px) saturate(185%);
      -webkit-backdrop-filter: blur(24px) saturate(185%);
      border: 1px solid var(--glass-border-strong);
      border-radius: 14px;
      padding: 7px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      z-index: 10000;
    }

    .ag-mascot-menu.open {
      display: flex;
    }

    .ag-mascot-menu.drop-down {
      bottom: auto;
      top: 106px;
    }

    .ag-menu-head {
      font-family: var(--font-mc);
      font-size: 9.5px;
      color: var(--t2);
      padding: 2px 4px 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ag-menu-item {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 5.5px 8px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      color: var(--t1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition: all 0.14s ease;
    }

    .ag-menu-item:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .ag-menu-item.danger:hover {
      color: var(--coral);
      background: rgba(255, 94, 126, 0.12);
      border-color: rgba(255, 94, 126, 0.3);
    }

    /* Authentic Master PNG Mascot Rig & Motion */
    .ag-mascot-rig {
      width: 88px;
      height: 88px;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ag-mascot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.6));
      transform-origin: 50% 82%;
      animation: agMascotBreathe 3s ease-in-out infinite;
    }

    .ag-mascot-rig[data-state="thinking"] .ag-mascot-img {
      animation: agMascotThinkTilt 1.6s ease-in-out infinite;
    }

    .ag-mascot-rig[data-state="working"] .ag-mascot-img {
      animation: agMascotWorkBounce 0.48s ease-in-out infinite;
    }

    .ag-mascot-rig[data-state="walking"] .ag-mascot-img {
      animation: agMascotWalkWaddle 0.36s ease-in-out infinite;
    }

    .ag-mascot-rig[data-state="sleeping"] .ag-mascot-img {
      opacity: 0.78;
      animation: agMascotSleepBreathe 4.2s ease-in-out infinite;
    }

    .ag-mascot-rig[data-state="offline"] .ag-mascot-img {
      filter: grayscale(0.75) brightness(0.75);
      opacity: 0.7;
    }

    @keyframes agMascotBreathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.018, 0.99); }
    }
    @keyframes agMascotThinkTilt {
      0%, 100% { transform: translateY(-2px) rotate(-3.5deg); }
      50% { transform: translateY(-5px) rotate(3.5deg); }
    }
    @keyframes agMascotWorkBounce {
      0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
      50% { transform: translateY(-6px) scale(0.98, 1.04); }
    }
    @keyframes agMascotWalkWaddle {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-5px) rotate(6deg); }
    }
    @keyframes agMascotSleepBreathe {
      0%, 100% { transform: translateY(3px) scale(1, 0.97); }
      50% { transform: translateY(1px) scale(1.02, 0.95); }
    }
  </style>
</head>
<body>

  <!-- ================================================================== -->
  <!--  1. APPLE-STYLE LIQUID GLASS DYNAMIC ISLAND NOTCH (TOP-CENTER)     -->
  <!-- ================================================================== -->
  <div class="ag-notch-wrapper interactive-hitbox" id="notchWrapper">
    <div class="ag-notch-pill" id="notchPill" onclick="toggleNotchExpand(event)">
      <div class="ag-notch-bar">
        <div class="ag-notch-left">
          <img class="ag-notch-mascot-thumb" src="../resources/mascot.png" alt="Antigravity" draggable="false" />
          <span class="ag-notch-led" id="notchLed"></span>
          <span class="ag-notch-status" id="notchStatusText">Antigravity</span>
        </div>
        <div class="ag-notch-right">
          <span class="ag-notch-model" id="notchModelBadge">Idle</span>
          <span class="ag-notch-timer" id="notchTimerText">00:00:00</span>
        </div>
      </div>

      <!-- Hover / Click Expanded Liquid Glass Island -->
      <div class="ag-notch-drawer" onclick="event.stopPropagation()">
        <div class="ag-notch-metrics">
          <div class="ag-notch-metric">
            <div class="lbl">24H</div>
            <div class="val" id="notchHrs24">0m</div>
          </div>
          <div class="ag-notch-metric">
            <div class="lbl">ALL</div>
            <div class="val" id="notchHrsAll">0m</div>
          </div>
          <div class="ag-notch-metric">
            <div class="lbl">24H TOK</div>
            <div class="val" id="notchTok24">0</div>
          </div>
          <div class="ag-notch-metric">
            <div class="lbl">ALL TOK</div>
            <div class="val" id="notchTokAll">0</div>
          </div>
        </div>
        <div class="ag-notch-actions">
          <button class="ag-glass-btn active" id="btnNotchMascotToggle" onclick="toggleMascotFromNotch()">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2L3 13h10L8 2z"/></svg>
            <span id="lblNotchMascotToggle">Mascot</span>
          </button>
          <button class="ag-glass-btn" onclick="openMainDashboard()">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M5 11V7M8 11V5M11 11V8"/></svg>
            <span>Studio</span>
          </button>
          <button class="ag-glass-btn active" id="btnNotchSfx" onclick="toggleOverlaySfx()">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="7" width="2.4" height="6" rx="0.8"/><rect x="6.8" y="3" width="2.4" height="10" rx="0.8"/><rect x="11.6" y="5" width="2.4" height="8" rx="0.8"/></svg>
            <span>Audio</span>
          </button>
          <button class="ag-glass-btn danger" onclick="disableNotchOnly()" title="Disable Liquid Glass Notch">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            <span>Hide</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================================================================== -->
  <!--  2. AUTHENTIC PNG DESKTOP MASCOT PET                               -->
  <!-- ================================================================== -->
  <div class="ag-mascot-actor interactive-hitbox" id="mascotActor">
    <div class="ag-mascot-bubble" id="mascotBubble">Idle</div>

    <!-- Liquid Glass Command Popover -->
    <div class="ag-mascot-menu" id="mascotMenu" onclick="event.stopPropagation()">
      <div class="ag-menu-head">
        <span>Antigravity</span>
        <span id="menuHrsBadge">0h</span>
      </div>
      <button class="ag-menu-item" onclick="toggleNotchFromMascot()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="4" width="12" height="8" rx="4"/></svg>
        <span id="lblMenuNotch">Toggle Liquid Notch</span>
      </button>
      <button class="ag-menu-item" onclick="commandMascot({ mascotBehavior: 'sit_corner' })">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3"/></svg>
        <span>Sit in Corner</span>
      </button>
      <button class="ag-menu-item" onclick="commandMascot({ mascotBehavior: 'walk_follow' })">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 13l3.5-5.5L9.5 10 13 4"/><circle cx="13" cy="4" r="1.5" fill="currentColor"/></svg>
        <span>Walk &amp; Follow</span>
      </button>
      <button class="ag-menu-item" onclick="commandMascot({ mascotBehavior: 'sleep' })">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11.5 10.5A5.5 5.5 0 0 1 5.5 4.5a5.5 5.5 0 1 0 6 6z"/></svg>
        <span>Sleep Mode</span>
      </button>
      <button class="ag-menu-item" onclick="cycleDesktopCorner()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 0 1-9.4 3.9L2.5 10.5M2.5 8a5.5 5.5 0 0 1 9.4-3.9l1.6 1.4"/></svg>
        <span>Switch Corner</span>
      </button>
      <button class="ag-menu-item" onclick="openMainDashboard()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M5 11V7M8 11V5M11 11V8"/></svg>
        <span>Open Studio</span>
      </button>
      <button class="ag-menu-item danger" onclick="disableMascotOnly()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        <span>Hide Mascot</span>
      </button>
    </div>

    <!-- Authentic Transparent Master PNG Mascot (Zero Fake SVG / Zero Emojis) -->
    <div class="ag-mascot-rig" id="mascot-rig-overlay" data-state="idle">
      <img class="ag-mascot-img" src="../resources/mascot.png" alt="Antigravity Mascot" draggable="false" />
    </div>
  </div>

  <script>
    /* 1. Procedural 8-Bit Chiptune Web Audio Synthesizer */
    (function() {
      let ctx = null;
      let muted = false;
      function getCtx() {
        if (muted) return null;
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(function() {});
        }
        return ctx;
      }
      function tone(freq, type, startSec, durSec, gainVal) {
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, c.currentTime + startSec);
        g.gain.setValueAtTime(gainVal || 0.035, c.currentTime + startSec);
        g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + startSec + durSec);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(c.currentTime + startSec);
        osc.stop(c.currentTime + startSec + durSec);
      }
      window.agMascotAudio = {
        setMuted: function(m) { muted = !!m; },
        isMuted: function() { return muted; },
        playClick: function() { tone(720, 'square', 0, 0.04, 0.03); tone(980, 'square', 0.04, 0.05, 0.03); },
        playWake: function() { tone(523.25, 'square', 0, 0.055, 0.035); tone(659.25, 'square', 0.055, 0.055, 0.035); tone(783.99, 'square', 0.11, 0.075, 0.04); },
        playComplete: function() { tone(587.33, 'triangle', 0, 0.065, 0.04); tone(880, 'triangle', 0.065, 0.085, 0.04); },
        playSleep: function() { tone(659.25, 'sine', 0, 0.09, 0.03); tone(523.25, 'sine', 0.09, 0.11, 0.025); },
        playMorph: function() { tone(440, 'triangle', 0, 0.045, 0.028); tone(660, 'square', 0.045, 0.075, 0.032); }
      };
    })();

    /* 2. Click-Through Hitbox Management (`setIgnoreMouseEvents`) */
    const bridge = window.antigravityDesktop;
    const notchWrapper = document.getElementById('notchWrapper');
    const mascotActor = document.getElementById('mascotActor');
    const mascotMenu = document.getElementById('mascotMenu');

    function setInteractiveFocus(isInside) {
      if (bridge && typeof bridge.setIgnoreMouseEvents === 'function') {
        bridge.setIgnoreMouseEvents(!isInside);
      }
    }

    [notchWrapper, mascotActor].forEach(function(el) {
      el.addEventListener('mouseenter', function() { setInteractiveFocus(true); });
      el.addEventListener('mouseleave', function() {
        if (!isDragging) setInteractiveFocus(false);
      });
    });

    /* 3. Mascot Physics, Corner Anchoring, Drag & Cursor Walk-Follow */
    let companion = {
      enabled: true,
      notchEnabled: true,
      mascotEnabled: true,
      mode: 'mascot',
      mascotBehavior: 'sit_corner',
      corner: 'bottom-right',
      soundMuted: false
    };
    let latestData = null;
    let lastAgentCount = 0;

    let mascotX = window.innerWidth - 124;
    let mascotY = window.innerHeight - 118;
    let targetX = mascotX;
    let targetY = mascotY;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragMoved = false;

    function getCornerCoords(corner) {
      const marginX = 24;
      const marginY = 20;
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (corner === 'bottom-left') return { x: marginX, y: h - 116 };
      if (corner === 'top-right') return { x: w - 124, y: marginY + 32 };
      if (corner === 'top-left') return { x: marginX, y: marginY + 32 };
      return { x: w - 124, y: h - 116 };
    }

    function applyMascotTransform(flipX) {
      mascotActor.style.left = Math.round(mascotX) + 'px';
      mascotActor.style.top = Math.round(mascotY) + 'px';
      const svgEl = document.getElementById('mascot-rig-overlay');
      if (svgEl) {
        svgEl.style.transform = flipX ? 'scaleX(-1)' : 'scaleX(1)';
      }
      if (mascotY < 170) {
        mascotMenu.classList.add('drop-down');
      } else {
        mascotMenu.classList.remove('drop-down');
      }
    }

    mascotActor.addEventListener('mousedown', function(e) {
      if (mascotMenu.contains(e.target)) return;
      isDragging = true;
      dragMoved = false;
      dragStartX = e.clientX - mascotX;
      dragStartY = e.clientY - mascotY;
      setInteractiveFocus(true);
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      const nx = e.clientX - dragStartX;
      const ny = e.clientY - dragStartY;
      if (Math.abs(nx - mascotX) > 4 || Math.abs(ny - mascotY) > 4) {
        dragMoved = true;
      }
      mascotX = Math.max(8, Math.min(window.innerWidth - 108, nx));
      mascotY = Math.max(8, Math.min(window.innerHeight - 108, ny));
      targetX = mascotX;
      targetY = mascotY;
      applyMascotTransform(false);
    });

    window.addEventListener('mouseup', function() {
      if (!isDragging) return;
      isDragging = false;
      if (!dragMoved) {
        window.agMascotAudio.playClick();
        mascotMenu.classList.toggle('open');
      } else {
        window.agMascotAudio.playWake();
      }
    });

    if (bridge && typeof bridge.onCursorMove === 'function') {
      bridge.onCursorMove(function(pt) {
        if (!companion.enabled || companion.mascotEnabled === false) return;
        if (companion.mascotBehavior !== 'walk_follow' || isDragging) return;
        targetX = Math.max(20, Math.min(window.innerWidth - 120, pt.x - 50));
        targetY = window.innerHeight - 116;
      });
    }

    function tickPhysics() {
      const showMascot = companion.enabled && companion.mascotEnabled !== false;
      if (showMascot && !isDragging) {
        if (companion.mascotBehavior === 'sit_corner' || companion.mascotBehavior === 'sleep') {
          const c = getCornerCoords(companion.corner || 'bottom-right');
          targetX = c.x;
          targetY = c.y;
        }
        const dx = targetX - mascotX;
        const dy = targetY - mascotY;
        const dist = Math.hypot(dx, dy);
        const rig = document.getElementById('mascot-rig-overlay');

        if (dist > 3) {
          const speed = companion.mascotBehavior === 'walk_follow' ? 0.09 : 0.16;
          mascotX += dx * speed;
          mascotY += dy * speed;
          applyMascotTransform(dx < -1);
          if (rig && companion.mascotBehavior === 'walk_follow') {
            rig.setAttribute('data-state', 'walking');
          }
        } else {
          syncMascotVisualState();
        }
      }
      requestAnimationFrame(tickPhysics);
    }
    requestAnimationFrame(tickPhysics);

    /* 4. Independent Notch & Mascot Visibility & Telemetry Sync */
    function formatCompact(n) {
      if (!n || n <= 0) return '0';
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(Math.round(n));
    }

    function formatHours(sec) {
      if (!sec || sec <= 0) return '0m';
      if (sec < 3600) return Math.max(1, Math.floor(sec / 60)) + 'm';
      return (sec / 3600).toFixed(1).replace(/\.0$/, '') + 'h';
    }

    function formatClock(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const p = function(v) { return v < 10 ? '0' + v : String(v); };
      return p(h) + ':' + p(m) + ':' + p(s);
    }

    function applyCompanionVisibility() {
      window.agMascotAudio.setMuted(!!companion.soundMuted);
      if (!companion.enabled) {
        notchWrapper.classList.add('hidden');
        mascotActor.classList.add('hidden');
        mascotMenu.classList.remove('open');
        setInteractiveFocus(false);
        return;
      }

      const showNotch = companion.notchEnabled !== false;
      const showMascot = companion.mascotEnabled !== false;

      notchWrapper.classList.toggle('hidden', !showNotch);
      mascotActor.classList.toggle('hidden', !showMascot);
      if (!showMascot) mascotMenu.classList.remove('open');

      const btnMascotToggle = document.getElementById('btnNotchMascotToggle');
      if (btnMascotToggle) btnMascotToggle.classList.toggle('active', showMascot);
      const btnSfx = document.getElementById('btnNotchSfx');
      if (btnSfx) btnSfx.classList.toggle('active', !companion.soundMuted);
      const lblMenuNotch = document.getElementById('lblMenuNotch');
      if (lblMenuNotch) lblMenuNotch.innerText = showNotch ? 'Hide Liquid Notch' : 'Show Liquid Notch';
    }

    function syncMascotVisualState() {
      const rig = document.getElementById('mascot-rig-overlay');
      const bubble = document.getElementById('mascotBubble');
      if (!rig || !bubble) return;

      if (!latestData || latestData.isAntigravityRunning === false) {
        rig.setAttribute('data-state', 'offline');
        bubble.innerText = 'Offline';
        return;
      }

      const agents = latestData.activeAgents || [];
      if (agents.length > 0) {
        const lead = agents[0];
        rig.setAttribute('data-state', lead.status === 'running_tool' ? 'working' : 'thinking');
        bubble.innerText = lead.model || 'Active';
      } else if (companion.mascotBehavior === 'sleep') {
        rig.setAttribute('data-state', 'sleeping');
        bubble.innerText = 'Sleeping';
      } else {
        rig.setAttribute('data-state', 'idle');
        const tb = latestData.timeBreakdown || (latestData.session && latestData.session.timeBreakdown);
        const allH = formatHours(tb ? tb.overall : (latestData.session ? latestData.session.lifetimeActiveSeconds : 0));
        bubble.innerText = 'Idle • ' + allH;
      }
    }

    function renderTelemetry(data) {
      if (!data) return;
      latestData = data;
      if (data.companion) {
        companion = Object.assign({}, companion, data.companion);
        applyCompanionVisibility();
      }

      const agents = data.activeAgents || [];
      if (lastAgentCount > 0 && agents.length === 0) {
        window.agMascotAudio.playComplete();
      }
      lastAgentCount = agents.length;

      const isRunning = data.isAntigravityRunning !== false;
      const led = document.getElementById('notchLed');
      const statusTxt = document.getElementById('notchStatusText');
      const modelBadge = document.getElementById('notchModelBadge');

      if (!isRunning) {
        if (led) led.className = 'ag-notch-led offline';
        if (statusTxt) statusTxt.innerText = 'Antigravity';
        if (modelBadge) modelBadge.innerText = 'Offline';
      } else if (agents.length > 0) {
        const lead = agents[0];
        if (led) led.className = 'ag-notch-led';
        if (statusTxt) statusTxt.innerText = agents.length + ' Agent' + (agents.length > 1 ? 's' : '');
        if (modelBadge) modelBadge.innerText = lead.model || 'Gemini';
      } else {
        if (led) led.className = 'ag-notch-led idle';
        if (statusTxt) statusTxt.innerText = 'Antigravity';
        if (modelBadge) modelBadge.innerText = 'Idle';
      }

      const tb = data.timeBreakdown || (data.session && data.session.timeBreakdown) || {};
      const tokB = data.tokenBreakdown || (data.session && data.session.tokenBreakdown) || {};

      const h24 = document.getElementById('notchHrs24');
      const hAll = document.getElementById('notchHrsAll');
      const t24 = document.getElementById('notchTok24');
      const tAll = document.getElementById('notchTokAll');
      const menuHrs = document.getElementById('menuHrsBadge');

      const overallSecs = tb.overall || (data.session && data.session.lifetimeActiveSeconds) || 0;
      if (h24) h24.innerText = formatHours(tb.last24h || 0);
      if (hAll) hAll.innerText = formatHours(overallSecs);
      if (menuHrs) menuHrs.innerText = formatHours(overallSecs);

      const totTok = (data.session && data.session.tokens) ? data.session.tokens.totalTokens : 0;
      if (t24) t24.innerText = formatCompact((tokB.last24h && tokB.last24h.totalTokens) || totTok);
      if (tAll) tAll.innerText = formatCompact((tokB.overall && tokB.overall.totalTokens) || totTok);

      if (data.session && data.session.startedAt) {
        const elapsed = isRunning
          ? Math.max(0, Math.floor((Date.now() - Date.parse(data.session.startedAt)) / 1000))
          : 0;
        const timerEl = document.getElementById('notchTimerText');
        if (timerEl) timerEl.innerText = formatClock(elapsed);
      }

      syncMascotVisualState();
    }

    async function commandMascot(partial) {
      mascotMenu.classList.remove('open');
      if (typeof partial.notchEnabled === 'boolean' || typeof partial.mascotEnabled === 'boolean') {
        window.agMascotAudio.playMorph();
      } else if (partial.mascotBehavior === 'sleep') {
        window.agMascotAudio.playSleep();
      } else {
        window.agMascotAudio.playClick();
      }

      companion = Object.assign({}, companion, partial);
      applyCompanionVisibility();
      syncMascotVisualState();

      try {
        await fetch('http://127.0.0.1:41177/api/companion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(partial)
        });
      } catch {}
    }

    function toggleMascotFromNotch() {
      const next = companion.mascotEnabled === false ? true : false;
      commandMascot({ enabled: true, mascotEnabled: next });
    }

    function toggleNotchFromMascot() {
      const next = companion.notchEnabled === false ? true : false;
      commandMascot({ enabled: true, notchEnabled: next });
    }

    function disableNotchOnly() {
      commandMascot({ notchEnabled: false });
    }

    function disableMascotOnly() {
      commandMascot({ mascotEnabled: false });
    }

    function cycleDesktopCorner() {
      const order = ['bottom-right', 'bottom-left', 'top-right', 'top-left'];
      const next = order[(order.indexOf(companion.corner || 'bottom-right') + 1) % order.length];
      commandMascot({ corner: next, mascotBehavior: 'sit_corner' });
    }

    function toggleOverlaySfx() {
      commandMascot({ soundMuted: !companion.soundMuted });
    }

    function openMainDashboard() {
      mascotMenu.classList.remove('open');
      window.agMascotAudio.playClick();
      if (bridge && typeof bridge.openDashboard === 'function') {
        bridge.openDashboard();
      } else {
        window.open('http://127.0.0.1:41177', '_blank');
      }
    }

    function toggleNotchExpand(e) {
      e.stopPropagation();
      window.agMascotAudio.playClick();
      document.getElementById('notchPill').classList.toggle('expanded');
    }

    if (bridge && typeof bridge.onCompanionCommand === 'function') {
      bridge.onCompanionCommand(function(nextComp) {
        companion = Object.assign({}, companion, nextComp);
        applyCompanionVisibility();
        syncMascotVisualState();
      });
    }

    function connectOverlayStream() {
      fetch('http://127.0.0.1:41177/api/overview')
        .then(function(r) { return r.json(); })
        .then(function(d) { renderTelemetry(d); })
        .catch(function() {});

      try {
        const es = new EventSource('http://127.0.0.1:41177/api/stream');
        es.onmessage = function(ev) {
          try { renderTelemetry(JSON.parse(ev.data)); } catch {}
        };
        es.onerror = function() {
          try { es.close(); } catch {}
          setTimeout(connectOverlayStream, 3000);
        };
      } catch {
        setTimeout(connectOverlayStream, 3000);
      }
    }

    applyCompanionVisibility();
    connectOverlayStream();
  </script>
</body>
</html>
