<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Apple Liquid Glass Aesthetics (iOS Dynamic Island & Frosted Obsidian) */
      --glass-island: linear-gradient(180deg, rgba(16, 20, 32, 0.90) 0%, rgba(8, 10, 18, 0.96) 100%);
      --glass-panel: rgba(14, 18, 28, 0.88);
      --glass-pill: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-strong: rgba(255, 255, 255, 0.28);
      --acc: #FFB84D;
      --emerald: #34F5A4;
      --cyan: #38E4FF;
      --coral: #FF5E7E;
      --t1: #F8FAFC;
      --t2: rgba(248, 250, 252, 0.74);
      --t3: rgba(248, 250, 252, 0.45);
      --font-mc: 'Minecraft', 'Minecraft Seven', 'Minecraftia', 'Silkscreen', 'Geist Mono', monospace;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', Consolas, monospace;

      /* Apple Fluid Spring Physics Curves */
      --spring-island: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-smooth: cubic-bezier(0.32, 0.72, 0, 1);
      --spring-mascot: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Zero-border frameless root (Eliminates Windows 11 DWM white line) */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      outline: 0 !important;
      background: transparent !important;
      font-family: var(--font-sans);
      color: var(--t1);
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
    }

    .interactive-hitbox {
      pointer-events: auto;
    }

    /* ================================================================== */
    /*  1. APPLE-STYLE LIQUID GLASS DYNAMIC ISLAND NOTCH (TOP-CENTER)     */
    /* ================================================================== */
    .ag-notch-wrapper {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 0 !important;
      outline: 0 !important;
      transition: opacity 0.28s var(--spring-smooth), transform 0.32s var(--spring-island);
    }

    .ag-notch-wrapper.hidden {
      opacity: 0;
      transform: translate(-50%, -100%) scale(0.92);
      pointer-events: none !important;
    }

    .ag-notch-pill {
      background: var(--glass-island);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-top: none !important;
      border-top-left-radius: 0 !important;
      border-top-right-radius: 0 !important;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      padding: 6px 16px 8px;
      min-width: 204px;
      box-shadow:
        0 14px 34px -4px rgba(0, 0, 0, 0.85),
        inset 0 -1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        min-width 0.36s var(--spring-island),
        border-bottom-left-radius 0.36s var(--spring-island),
        border-bottom-right-radius 0.36s var(--spring-island),
        padding 0.36s var(--spring-island),
        border-color 0.22s ease,
        box-shadow 0.26s ease;
    }

    .ag-notch-pill:hover,
    .ag-notch-pill.expanded {
      border-color: var(--glass-border-strong);
      border-top: none !important;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      min-width: 380px;
      padding: 10px 18px 14px;
      box-shadow:
        0 20px 48px -6px rgba(0, 0, 0, 0.9),
        inset 0 -1px 0 rgba(255, 255, 255, 0.2),
        0 0 24px rgba(52, 245, 164, 0.12);
    }

    .ag-notch-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ag-notch-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .ag-notch-mascot-thumb {
      width: 21px;
      height: 21px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
    }

    .ag-notch-led {
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      flex-shrink: 0;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .ag-notch-led.idle {
      background: var(--acc);
      box-shadow: 0 0 7px var(--acc);
    }

    .ag-notch-led.offline {
      background: var(--coral);
      box-shadow: 0 0 7px var(--coral);
    }

    .ag-notch-status {
      font-family: var(--font-mc);
      font-size: 10px;
      color: var(--t1);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .ag-notch-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .ag-notch-model {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--acc);
      padding: 1.5px 7px;
      border-radius: 999px;
      background: rgba(255, 184, 77, 0.14);
      border: 1px solid rgba(255, 184, 77, 0.3);
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ag-notch-timer {
      font-family: var(--font-mc);
      font-size: 9.5px;
      color: var(--cyan);
    }

    /* Expanded Drawer Section */
    .ag-notch-drawer {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      cursor: default;
    }

    .ag-notch-pill.expanded .ag-notch-drawer {
      display: flex;
      animation: agDrawerFade 0.26s var(--spring-smooth);
    }

    @keyframes agDrawerFade {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .ag-notch-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .ag-notch-metric {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 6px 4px;
      text-align: center;
    }

    .ag-notch-metric .lbl {
      font-family: var(--font-mc);
      font-size: 8px;
      color: var(--t3);
      margin-bottom: 2px;
    }

    .ag-notch-metric .val {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--emerald);
    }

    .ag-notch-actions {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .ag-glass-btn {
      flex: 1;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--t1);
      font-family: var(--font-mc);
      font-size: 9.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.16s var(--spring-smooth);
    }

    .ag-glass-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .ag-glass-btn.active {
      color: var(--emerald);
      border-color: rgba(52, 245, 164, 0.35);
      background: rgba(52, 245, 164, 0.12);
    }

    .ag-glass-btn.danger:hover {
      color: var(--coral);
      border-color: rgba(255, 94, 126, 0.45);
      background: rgba(255, 94, 126, 0.14);
    }

    /* ================================================================== */
    /*  2. AUTHENTIC PNG DESKTOP MASCOT PET & SCREEN-CLAMPED POPOVER      */
    /* ================================================================== */
    .ag-mascot-actor {
      position: fixed;
      z-index: 9998;
      width: 104px;
      height: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      border: 0 !important;
      outline: 0 !important;
      transition: opacity 0.24s ease;
    }

    .ag-mascot-actor:active {
      cursor: grabbing;
    }

    .ag-mascot-actor.hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    /* Speech Bubble / Status Tag */
    .ag-mascot-bubble {
      position: absolute;
      bottom: 102px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-panel);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 3.5px 11px;
      font-family: var(--font-mc);
      font-size: 9px;
      color: var(--t1);
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s var(--spring-smooth);
    }

    /* Task Completion Return Callout Bubble */
    .ag-mascot-callout {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s var(--spring-snap);
      z-index: 10001;
      width: 220px;
    }

    .ag-mascot-callout.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .ag-callout-glass {
      background: linear-gradient(180deg, rgba(16, 22, 34, 0.94) 0%, rgba(8, 12, 20, 0.98) 100%);
      backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(52, 245, 164, 0.45);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 20px 48px -6px rgba(0, 0, 0, 0.9), 0 0 24px rgba(52, 245, 164, 0.22);
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    .ag-callout-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mc);
      font-size: 10.5px;
      color: var(--emerald);
    }

    .ag-callout-body {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--t2);
      line-height: 1.3;
    }

    .ag-callout-btn {
      width: 100%;
      height: 28px;
      border-radius: 8px;
      background: var(--emerald);
      color: #06080E;
      border: none;
      font-family: var(--font-mc);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      transition: transform 0.14s var(--spring-snap), filter 0.14s ease;
    }

    .ag-callout-btn:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    /* Screen-Boundary Clamped Liquid Glass Popover Menu */
    .ag-mascot-menu {
      position: absolute;
      bottom: 118px;
      left: 0;
      width: 208px;
      box-sizing: border-box;
      background: linear-gradient(180deg, rgba(14, 18, 28, 0.94) 0%, rgba(8, 10, 16, 0.98) 100%);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--glass-border-strong);
      border-radius: 16px;
      padding: 8px 9px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 20px 48px -4px rgba(0, 0, 0, 0.88), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      z-index: 10000;
      animation: agMenuPop 0.22s var(--spring-snap);
    }

    .ag-mascot-menu.open {
      display: flex;
    }

    .ag-mascot-menu.drop-down {
      bottom: auto;
      top: 108px;
    }

    @keyframes agMenuPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .ag-menu-head {
      font-family: var(--font-mc);
      font-size: 10px;
      color: var(--t2);
      padding: 3px 6px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ag-menu-item {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      font-family: var(--font-mc);
      font-size: 10px;
      color: var(--t1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: all 0.14s ease;
    }

    .ag-menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .ag-menu-item.danger:hover {
      color: var(--coral);
      background: rgba(255, 94, 126, 0.14);
      border-color: rgba(255, 94, 126, 0.35);
    }

    .ag-menu-section-title {
      font-family: var(--font-mc);
      font-size: 8.5px;
      color: var(--t3);
      padding: 6px 4px 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 4px;
    }

    .ag-menu-quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px 0 2px;
    }

    .ag-menu-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 4px 5px;
      color: var(--t1);
      font-family: var(--font-sans);
      font-size: 9.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.14s ease;
    }

    .ag-menu-chip:hover {
      background: rgba(52, 245, 164, 0.14);
      border-color: rgba(52, 245, 164, 0.4);
      color: #FFF;
      transform: translateY(-1px);
    }

    /* ================================================================== */
    /*  3. AUTHENTIC PNG MASCOT RIG, SMILE OVERLAY & 32 KINEMATIC MOTIONS */
    /* ================================================================== */
    .ag-mascot-rig {
      width: 90px;
      height: 90px;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ag-mascot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.65));
      transform-origin: 50% 82%;
      will-change: transform;
      animation: agM15IdleBreathe 3.4s ease-in-out infinite;
    }

    /* Responsive SVG Facial Expression Overlay (Smile, Laugh, Curious, Surprised, Sleepy, Wink) */
    .ag-mascot-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.18s ease;
    }

    .ag-face-mouth {
      stroke: #0B1020;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.2s var(--spring-smooth);
    }

    .ag-face-eye-wink {
      stroke: #0B1020;
      stroke-linecap: round;
      fill: none;
    }

    /* Ground Shadow */
    .ag-mascot-shadow {
      position: absolute;
      bottom: 2px;
      width: 58px;
      height: 10px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      filter: blur(4px);
      z-index: 0;
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    /* 32 MOVEMENT CLASSES */
    /* Category A: Prompt & Typing Interactions */
    .ag-mascot-rig.ag-m-prompt-approach .ag-mascot-img { animation: agM01Approach 0.4s var(--spring-mascot) forwards; }
    .ag-mascot-rig.ag-m-prompt-chirp .ag-mascot-img { animation: agM02Chirp 0.14s ease-out; }
    .ag-mascot-rig.ag-m-prompt-launch .ag-mascot-img { animation: agM03Launch 0.85s var(--spring-island); }
    .ag-mascot-rig.ag-m-prompt-pause .ag-mascot-img { animation: agM04Pause 1.2s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-poke-surprise .ag-mascot-img { animation: agM05Surprise 0.65s var(--spring-snap); }
    .ag-mascot-rig.ag-m-pet-purr .ag-mascot-img { animation: agM06Purr 1.4s ease-in-out infinite; }

    /* Category B: Agent Lifecycle & Execution */
    .ag-mascot-rig.ag-m-thinking-levitate .ag-mascot-img { animation: agM07ThinkLevitate 2.4s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-tool-executing .ag-mascot-img { animation: agM08ToolExecute 0.68s var(--spring-snap); }
    .ag-mascot-rig.ag-m-file-laser .ag-mascot-img { animation: agM09FileLaser 0.8s linear infinite; }
    .ag-mascot-rig.ag-m-error-shudder .ag-mascot-img { animation: agM10ErrorShudder 0.48s ease-in-out; }
    .ag-mascot-rig.ag-m-done-celebrate .ag-mascot-img { animation: agM11DoneCelebrate 0.85s var(--spring-island); }
    .ag-mascot-rig.ag-m-done-callout .ag-mascot-img { animation: agM12DoneCallout 2.2s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-subagent-spawn .ag-mascot-img { animation: agM13SubagentSpawn 0.72s var(--spring-smooth); }
    .ag-mascot-rig.ag-m-stream-sync .ag-mascot-img { animation: agM14StreamSync 0.12s ease-out; }

    /* Category C: Desktop Life & Ambient Idle */
    .ag-mascot-rig.ag-m-idle-breathe .ag-mascot-img { animation: agM15IdleBreathe 3.4s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-perch-look .ag-mascot-img { animation: agM16PerchLook 3.2s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-stretch-yawn .ag-mascot-img { animation: agM17StretchYawn 1.8s var(--spring-smooth); }
    .ag-mascot-rig.ag-m-bubble-float .ag-mascot-img { animation: agM18BubbleFloat 3.6s ease-in-out; }
    .ag-mascot-rig.ag-m-edge-peek .ag-mascot-img { animation: agM19EdgePeek 2.0s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-sleep-snore .ag-mascot-img { animation: agM20SleepSnore 4.8s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-wake-shake .ag-mascot-img { animation: agM21WakeShake 0.72s ease-out; }
    .ag-mascot-rig.ag-m-inspect-cursor .ag-mascot-img { animation: agM22InspectCursor 0.8s ease-in-out infinite; }

    /* Category D: Dynamic Notch Interactions */
    .ag-mascot-rig.ag-m-notch-dive .ag-mascot-img { animation: agM23NotchDive 0.55s var(--spring-island); }
    .ag-mascot-rig.ag-m-notch-peek .ag-mascot-img { animation: agM24NotchPeek 1.8s ease-in-out; }
    .ag-mascot-rig.ag-m-notch-swing .ag-mascot-img { animation: agM25NotchSwing 1.4s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-notch-eject .ag-mascot-img { animation: agM26NotchEject 0.6s var(--spring-island); }

    /* Category E: Telemetry & Special Alerts */
    .ag-mascot-rig.ag-m-alert-hop .ag-mascot-img { animation: agM27AlertHop 0.62s var(--spring-snap); }
    .ag-mascot-rig.ag-m-milestone-parade .ag-mascot-img { animation: agM28MilestoneParade 2.4s ease-in-out infinite; }
    .ag-mascot-rig.ag-m-coffee-toast .ag-mascot-img { animation: agM29CoffeeToast 4.0s ease-in-out; }
    .ag-mascot-rig.ag-m-goodbye-wave .ag-mascot-img { animation: agM30GoodbyeWave 1.2s ease-in-out; }
    .ag-mascot-rig.ag-m-speedrun-dash .ag-mascot-img { animation: agM31SpeedrunDash 0.8s cubic-bezier(0.12, 0.8, 0.32, 1); }
    .ag-mascot-rig.ag-m-shield-defend .ag-mascot-img { animation: agM32ShieldDefend 1.1s var(--spring-snap); }

    /* TRUE WALKING WADDLE KINEMATICS */
    .ag-mascot-rig[data-state="walking"] .ag-mascot-img {
      animation: agWalkKinematics 0.42s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes agWalkKinematics {
      0% { transform: translateY(0px) rotate(-4.5deg) scale(1.04, 0.96); }
      25% { transform: translateY(-5px) rotate(0deg) scale(0.98, 1.02); }
      50% { transform: translateY(0px) rotate(4.5deg) scale(1.04, 0.96); }
      75% { transform: translateY(-5px) rotate(0deg) scale(0.98, 1.02); }
      100% { transform: translateY(0px) rotate(-4.5deg) scale(1.04, 0.96); }
    }

    /* KEYFRAME DEFINITIONS */
    @keyframes agM01Approach {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translate(-12px, -18px) rotate(8deg); }

<body>

  <!-- ================================================================== -->
  <!--  1. APPLE-STYLE LIQUID GLASS DYNAMIC ISLAND NOTCH (TOP-CENTER)     -->

  <!-- ================================================================== -->
  <!--  2. AUTHENTIC PNG DESKTOP MASCOT PET & SCREEN-CLAMPED POPOVER      -->
  <!-- ================================================================== -->
  <div class="ag-mascot-actor interactive-hitbox" id="mascotActor">
    <div class="ag-mascot-bubble" id="mascotBubble">Idle</div>

    <!-- Task Completion Return to IDE Callout -->
    <div class="ag-mascot-callout" id="mascotCallout">

        <span>Sleep Mode</span>

        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 0 1-9.4 3.9L2.5 10.5M2.5 8a5.5 5.5 0 0 1 9.4-3.9l1.6 1.4"/></svg>

    <!-- Authentic Transparent Master PNG Mascot + Responsive SVG Facial Overlay -->
    <div class="ag-mascot-rig ag-m-idle-breathe" id="mascot-rig-overlay" data-state="idle">
      <div class="ag-mascot-shadow"></div>

      <svg class="ag-mascot-face" id="mascotFace" viewBox="0 0 100 100" data-expression="smile">
        <g class="ag-face-group" id="faceMouthGroup">
          <path class="ag-face-mouth" d="M 44,61 Q 50,67 56,61" fill="none" stroke="#0B1020" stroke-width="2.4" stroke-linecap="round" />
        </g>
      </svg>
    </div>
  </div>

  <script>
    /* ================================================================== */
    /*  1. APPLE-INSPIRED TACTILE UI SOUND SUITE (WEB AUDIO API)           */
    /* ================================================================== */
    (function() {
      let ctx = null;
      let muted = false;

      function getCtx() {
        if (muted) return null;
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(function() {});
        }
        return ctx;
      }

      function tone(freq, type, startSec, durSec, gainVal, rampZero) {
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, c.currentTime + startSec);
        g.gain.setValueAtTime(gainVal || 0.035, c.currentTime + startSec);
        if (rampZero !== false) {
          g.gain.exponentialRampToValueAtTime(0.0005, c.currentTime + startSec + durSec);
        }
        osc.connect(g);
        g.connect(c.destination);
        osc.start(c.currentTime + startSec);
        osc.stop(c.currentTime + startSec + durSec);
      }

      window.agMascotAudio = {
        setMuted: function(m) { muted = Boolean(m); },
        isMuted: function() { return muted; },

        // S01: Apple Island Expand Pop (glass tick 780Hz & 1170Hz)
        playIslandExpand: function() {
          tone(780, 'sine', 0, 0.022, 0.038);
          tone(1170, 'triangle', 0.004, 0.018, 0.02);
        },

        // S02: Apple Island Collapse Tuck (cushioned 340Hz)
        playIslandCollapse: function() {
          tone(340, 'sine', 0, 0.028, 0.032);
        },

        // S03: Tactile Marimba Typing Tap (480Hz – 620Hz, throttled)
        playMarimbaTap: (function() {
          let last = 0;
          return function() {
            const now = Date.now();
            if (now - last < 120) return;
            last = now;
            const f = 480 + Math.random() * 140;
            tone(f, 'triangle', 0, 0.016, 0.018);
          };
        })(),

        // S04: AirDrop Send Swoosh Chord (F4 → C5 → F5)
        playAirDropChime: function() {
          tone(349.23, 'sine', 0, 0.14, 0.035);
          tone(523.25, 'triangle', 0.06, 0.16, 0.032);
          tone(698.46, 'sine', 0.12, 0.22, 0.038);
        },

        // S05: Apple Pay / Triumph Crystalline Bell (E6: 1318Hz & B6: 1975Hz)
        playApplePayTriumph: function() {
          tone(1318.5, 'sine', 0, 0.55, 0.048);
          tone(1975.5, 'sine', 0.05, 0.65, 0.042);
        },

        // S06: Haptic Switch Click (240Hz impulse)
        playHapticSwitch: function() {
          tone(240, 'triangle', 0, 0.014, 0.03);
          tone(480, 'sine', 0.008, 0.016, 0.02);
        },

        // S07: Organic Purr Rumble (52Hz modulated at 8Hz)
        playOrganicPurr: function() {
          tone(52, 'triangle', 0, 0.45, 0.02);
          tone(104, 'sine', 0.08, 0.35, 0.012);
        },

        // S08: Warm Alert Ping (A5: 880Hz to C#6: 1108Hz)
        playWarmAlert: function() {
          tone(880, 'sine', 0, 0.12, 0.04);
          tone(1108.7, 'sine', 0.07, 0.18, 0.04);
        },

        // S09: Magnetic Dock Snap (880Hz → 440Hz sweep)
        playMagneticDock: function() {
          tone(880, 'sine', 0, 0.035, 0.035);
          tone(440, 'triangle', 0.015, 0.045, 0.03);
        },

        // S10: Water Droplet Undock Pop (380Hz → 720Hz)
        playBubbleUndock: function() {
          tone(380, 'sine', 0, 0.02, 0.03);
          tone(720, 'triangle', 0.015, 0.035, 0.035);
        },

        // Backward-compatible aliases
        playClick: function() { window.agMascotAudio.playHapticSwitch(); },
        playWake: function() { window.agMascotAudio.playIslandExpand(); },
        playComplete: function() { window.agMascotAudio.playApplePayTriumph(); },
        playSleep: function() { window.agMascotAudio.playIslandCollapse(); },
        playMorph: function() { window.agMascotAudio.playMagneticDock(); }
      };
    })();

    /* ================================================================== */
    /*  2. DOM CONTROLLERS & VIEWPORT-CLAMPED MENU POSITIONING            */
    /* ================================================================== */
    const bridge = window.antigravityDesktop || null;
    const notchWrapper = document.getElementById('notchWrapper');
    const mascotActor = document.getElementById('mascotActor');
    const mascotMenu = document.getElementById('mascotMenu');
    const mascotRig = document.getElementById('mascot-rig-overlay');
    const faceMouthGroup = document.getElementById('faceMouthGroup');
    const mascotCallout = document.getElementById('mascotCallout');

    function setInteractiveFocus(isInside) {
      if (bridge && typeof bridge.setIgnoreMouseEvents === 'function') {
        bridge.setIgnoreMouseEvents(!isInside);
      }
    }

    [notchWrapper, mascotActor].forEach(function(el) {
      el.addEventListener('mouseenter', function() { setInteractiveFocus(true); });
      el.addEventListener('mouseleave', function() {
        if (!isDragging) setInteractiveFocus(false);
      });
    });

    /**
     * Mathematical Viewport Boundary Clamping Algorithm
     * Guaranteed zero-clipping at all screen boundaries.
     */
    function updateMenuPosition() {
      if (!mascotActor || !mascotMenu) return;
      const actorRect = mascotActor.getBoundingClientRect();
      const menuWidth = 208;
      const margin = 14;

      // Calculate ideal centered screen X coordinate
      const idealScreenX = actorRect.left + (actorRect.width / 2) - (menuWidth / 2);

      // Clamp strictly inside viewport [margin, window.innerWidth - menuWidth - margin]
      const clampedScreenX = Math.max(margin, Math.min(window.innerWidth - menuWidth - margin, idealScreenX));

      // Set relative offset
      const relativeLeft = clampedScreenX - actorRect.left;
      mascotMenu.style.left = Math.round(relativeLeft) + 'px';
      mascotMenu.style.transform = 'none';

      const menuHeight = mascotMenu.offsetHeight || 290;
      if (actorRect.top < menuHeight + 24) {
        mascotMenu.classList.add('drop-down');
      } else {
        mascotMenu.classList.remove('drop-down');
      }
    }

    window.addEventListener('resize', updateMenuPosition);

    /* ================================================================== */
    /*  3. DYNAMIC FACIAL EXPRESSIONS & NATURAL SMILE CONTROLLER          */
    /* ================================================================== */
    const FACE_PATHS = {
      smile: '<path class="ag-face-mouth" d="M 44,57 Q 50,63 56,57" fill="none" stroke="#0B1020" stroke-width="2.4" stroke-linecap="round" />',
      laugh: '<path class="ag-face-mouth" d="M 43,56 Q 50,65 57,56 Z" fill="#0B1020" stroke="#0B1020" stroke-width="1.5" /><path d="M 46,60 Q 50,63 54,60" fill="#FF5E7E" />',
      curious: '<path class="ag-face-mouth" d="M 45,58 Q 51,61 57,56" fill="none" stroke="#0B1020" stroke-width="2.4" stroke-linecap="round" />',
      surprised: '<ellipse class="ag-face-mouth" cx="50" cy="58" rx="3.5" ry="4.5" fill="#0B1020" stroke="none" />',
      sleepy: '<path class="ag-face-mouth" d="M 45,58 L 55,58" fill="none" stroke="#0B1020" stroke-width="2.2" stroke-linecap="round" />',
      wink: '<path class="ag-face-mouth" d="M 44,57 Q 50,63 56,56" fill="none" stroke="#0B1020" stroke-width="2.4" stroke-linecap="round" /><path class="ag-face-eye-wink" d="M 40,46 Q 43,42 46,46" stroke="#0B1020" stroke-width="2.8" fill="none" stroke-linecap="round" />'
    };

    function setMascotFacialState(state) {
      if (!faceMouthGroup) return;
      const html = FACE_PATHS[state] || FACE_PATHS.smile;
      faceMouthGroup.innerHTML = html;
      const faceEl = document.getElementById('mascotFace');
      if (faceEl) faceEl.setAttribute('data-expression', state);
    }

    /* ================================================================== */
    /*  4. 32-MOVEMENT ENGINE & TRUE WALKING KINEMATICS                   */
    /* ================================================================== */
    let currentMovementTimeout = null;
    let tempBubbleTimer = null;

    function showMascotTempBubble(text, durationMs = 2800) {
      const bubble = document.getElementById('mascotBubble');
      if (!bubble) return;
      if (tempBubbleTimer) clearTimeout(tempBubbleTimer);
      bubble.innerText = text;
      bubble.style.opacity = '1';
      bubble.style.transform = 'translateX(-50%) translateY(-2px)';
      tempBubbleTimer = setTimeout(function() {
        syncMascotVisualState();
      }, durationMs);
    }

    function setMascotMovement(movClass, facialState, durationMs, pairedSound) {
      if (!mascotRig) return;
      if (currentMovementTimeout) clearTimeout(currentMovementTimeout);

      // Apply animated keyframe class
      mascotRig.className = 'ag-mascot-rig ' + movClass;
      setMascotFacialState(facialState || 'smile');

      if (pairedSound && window.agMascotAudio[pairedSound]) {
        window.agMascotAudio[pairedSound]();
      }

      if (durationMs && durationMs > 0) {
        currentMovementTimeout = setTimeout(function() {
          syncMascotVisualState();
        }, durationMs);
      }
    }

    function playMovementAction(action) {
      if (action === 'launch') {
        setMascotMovement('ag-m-prompt-launch', 'laugh', 850, 'apple_pay_triumph');
        showMascotTempBubble('🦘 Hop & Jump!');
      } else if (action === 'celebrate') {
        setMascotMovement('ag-m-done-celebrate', 'laugh', 1200, 'apple_pay_triumph');
        showTaskCompleteCallout();
      } else if (action === 'wave') {
        setMascotMovement('ag-m-goodbye-wave', 'smile', 950, 'airdrop_chime');
        showMascotTempBubble('👋 Hello Jamie!');
      } else if (action === 'coffee') {
        setMascotMovement('ag-m-coffee-toast', 'smile', 1200, 'marimba_tap');
        showMascotTempBubble('☕ Coffee Break!');
      } else if (action === 'look') {
        setMascotMovement('ag-m-perch-look', 'curious', 1400, 'haptic_switch');
        showMascotTempBubble('👀 Looking around');
      } else if (action === 'yawn') {
        setMascotMovement('ag-m-stretch-yawn', 'sleepy', 1600, 'organic_purr');
        showMascotTempBubble('🥱 Yaaawn~');
      }
    }

    /* 5. Mascot Physics, Corner Anchoring, Drag & Cursor Walk-Follow */
    let companion = {
      enabled: true,
      notchEnabled: true,
      mascotEnabled: true,
      mode: 'mascot',
      mascotBehavior: 'sit_corner',
      corner: 'bottom-right',
      soundMuted: false
    };
    let latestData = null;
    let lastAgentCount = 0;
    let lastTypingSeenAt = 0;

    let mascotX = window.innerWidth - 124;
    let mascotY = window.innerHeight - 118;
    let targetX = mascotX;
    let targetY = mascotY;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragMoved = false;

    function getCornerCoords(corner) {
      const marginX = 24;
      const w = Math.max(400, window.innerWidth);
      const h = Math.max(300, window.innerHeight);
      const bottomY = Math.max(120, h - 122);
      if (corner === 'bottom-left' || corner === 'top-left') return { x: marginX, y: bottomY };
      return { x: w - 124, y: bottomY };
    }

    window.addEventListener('resize', function() {
      if (companion.mascotBehavior === 'sit_corner' || companion.mascotBehavior === 'sleep') {
        const c = getCornerCoords(companion.corner || 'bottom-right');
        targetX = c.x;
        targetY = c.y;
        mascotY = c.y;
      }
    });

    function applyMascotTransform(flipX) {
      mascotActor.style.left = Math.round(mascotX) + 'px';
      mascotActor.style.top = Math.round(mascotY) + 'px';
      if (mascotRig) {
        mascotRig.style.transform = flipX ? 'scaleX(-1)' : 'scaleX(1)';
      }
      updateMenuPosition();
    }

    mascotActor.addEventListener('mousedown', function(e) {
      if (mascotMenu.contains(e.target) || (mascotCallout && mascotCallout.contains(e.target))) return;
      isDragging = true;
      dragMoved = false;
      dragStartX = e.clientX - mascotX;
      dragStartY = e.clientY - mascotY;
      setInteractiveFocus(true);
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      const nx = e.clientX - dragStartX;
      const ny = e.clientY - dragStartY;
      if (Math.abs(nx - mascotX) > 4 || Math.abs(ny - mascotY) > 4) {
        dragMoved = true;
      }
      mascotX = Math.max(8, Math.min(window.innerWidth - 108, nx));
      mascotY = Math.max(8, Math.min(window.innerHeight - 108, ny));
      targetX = mascotX;
      targetY = mascotY;
      applyMascotTransform(false);
    });

    mascotActor.addEventListener('mouseenter', function() {
      setInteractiveFocus(true);
      if (companion.mascotBehavior !== 'sleep' && (!mascotRig || !mascotRig.classList.contains('ag-m-done-celebrate'))) {
        setMascotFacialState('curious');
        if (window.agMascotAudio) window.agMascotAudio.playHapticSwitch();
      }
    });

    mascotActor.addEventListener('mouseleave', function() {
      if (!isDragging) setInteractiveFocus(false);
      if (companion.mascotBehavior !== 'sleep') {
        setMascotFacialState('smile');
      }
    });

    window.addEventListener('mouseup', function() {
      if (!isDragging) return;
      isDragging = false;
      if (!dragMoved) {
        if (window.agMascotAudio) window.agMascotAudio.playApplePayTriumph();
        setMascotMovement('ag-m-prompt-launch', 'laugh', 850, null);
        showMascotTempBubble('✨ Antigravity!');
        const isOpen = mascotMenu.classList.toggle('open');
        if (isOpen) updateMenuPosition();
      } else {
        if (window.agMascotAudio) window.agMascotAudio.playIslandExpand();
      }
    });

    if (bridge && typeof bridge.onCursorMove === 'function') {
      bridge.onCursorMove(function(pt) {
        if (!companion.enabled || companion.mascotEnabled === false) return;
        if (companion.mascotBehavior !== 'walk_follow' || isDragging) return;
        targetX = Math.max(20, Math.min(window.innerWidth - 120, pt.x - 50));
        targetY = window.innerHeight - 116;
      });
    }

    function tickPhysics() {
      const showMascot = companion.enabled && companion.mascotEnabled !== false;
      if (showMascot && !isDragging) {
        if (companion.mascotBehavior === 'sit_corner' || companion.mascotBehavior === 'sleep') {
          const c = getCornerCoords(companion.corner || 'bottom-right');
          targetX = c.x;
          targetY = c.y;
        }
        const dx = targetX - mascotX;
        const dy = targetY - mascotY;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          const speed = companion.mascotBehavior === 'walk_follow' ? 0.09 : 0.16;
          mascotX += dx * speed;
          mascotY += dy * speed;
          applyMascotTransform(dx < -1);
          if (mascotRig && companion.mascotBehavior === 'walk_follow') {
            mascotRig.setAttribute('data-state', 'walking');
          }
        } else {
          syncMascotVisualState();
        }
      }
      requestAnimationFrame(tickPhysics);
    }
    requestAnimationFrame(tickPhysics);

    /* ================================================================== */
    /*  6. TELEMETRY, AGENT STATE SYNC & TASK CALLOUTS                    */
    /* ================================================================== */
    function formatCompact(n) {
      if (!n || n <= 0) return '0';
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(Math.round(n));
    }

    function formatHours(sec) {
      if (!sec || sec <= 0) return '0m';
      if (sec < 3600) return Math.max(1, Math.floor(sec / 60)) + 'm';
      return (sec / 3600).toFixed(1).replace(/\.0$/, '') + 'h';
    }

    function formatClock(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const pad = function(n) { return n < 10 ? '0' + n : String(n); };
      return pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function showTaskCompleteCallout() {
      if (!mascotCallout) return;
      mascotCallout.classList.add('show');
      setTimeout(function() {
        if (mascotCallout) mascotCallout.classList.remove('show');
      }, 14000);
    }

    function focusIdeFromCallout(e) {
      if (e) e.stopPropagation();
      window.agMascotAudio.playHapticSwitch();
      if (mascotCallout) mascotCallout.classList.remove('show');
      if (bridge && typeof bridge.focusIde === 'function') {
        bridge.focusIde();
      }
    }

    function applyCompanionVisibility() {
      const showNotch = companion.enabled && companion.notchEnabled !== false;
      const showMascot = companion.enabled && companion.mascotEnabled !== false;

      notchWrapper.classList.toggle('hidden', !showNotch);
      mascotActor.classList.toggle('hidden', !showMascot);
      if (!showMascot) mascotMenu.classList.remove('open');

      const btnMascotToggle = document.getElementById('btnNotchMascotToggle');
      if (btnMascotToggle) btnMascotToggle.classList.toggle('active', showMascot);
      const btnSfx = document.getElementById('btnNotchSfx');
      if (btnSfx) btnSfx.classList.toggle('active', !companion.soundMuted);
      const lblMenuNotch = document.getElementById('lblMenuNotch');
      if (lblMenuNotch) lblMenuNotch.innerText = showNotch ? 'Hide Liquid Notch' : 'Show Liquid Notch';
    }

    function syncMascotVisualState() {
      const bubble = document.getElementById('mascotBubble');
      if (!mascotRig || !bubble) return;

      if (!latestData || latestData.isAntigravityRunning === false) {
        mascotRig.setAttribute('data-state', 'offline');
        mascotRig.className = 'ag-mascot-rig ag-m-sleep-snore';
        setMascotFacialState('sleepy');
        bubble.innerText = 'Offline';
        return;
      }

      const agents = latestData.activeAgents || [];
      if (agents.length > 0) {
        const lead = agents[0];
        const isTool = lead.status === 'running_tool';
        mascotRig.setAttribute('data-state', isTool ? 'working' : 'thinking');
        mascotRig.className = 'ag-mascot-rig ' + (isTool ? 'ag-m-tool-execute' : 'ag-m-think-levitate');
        setMascotFacialState(isTool ? 'laugh' : 'curious');
        bubble.innerText = (isTool ? 'Tool: ' : 'Thinking: ') + (lead.model || 'Active');
      } else if (companion.mascotBehavior === 'sleep') {
        mascotRig.setAttribute('data-state', 'sleeping');
        mascotRig.className = 'ag-mascot-rig ag-m-sleep-snore';
        setMascotFacialState('sleepy');
        bubble.innerText = 'Sleeping 💤';
      } else {
        mascotRig.setAttribute('data-state', 'idle');
        mascotRig.className = 'ag-mascot-rig ag-m-idle-breathe';
        setMascotFacialState('smile');
        const tb = latestData.timeBreakdown || (latestData.session && latestData.session.timeBreakdown);
        const allH = formatHours(tb ? tb.overall : (latestData.session ? latestData.session.lifetimeActiveSeconds : 0));
        bubble.innerText = 'Online • ' + allH;
      }
    }

    // Autonomous Ambient Desktop Pet Life: Periodic organic animations
    let ambientLifeInterval = null;
    function startAmbientPetLife() {
      if (ambientLifeInterval) clearInterval(ambientLifeInterval);
      ambientLifeInterval = setInterval(function() {
        if (!companion.enabled || companion.mascotEnabled === false) return;
        if (companion.mascotBehavior === 'sleep' || isDragging) return;
        if (mascotMenu && mascotMenu.classList.contains('open')) return;
        if (mascotRig && (mascotRig.getAttribute('data-state') === 'working' || mascotRig.getAttribute('data-state') === 'thinking')) return;

        const ambientMoves = [
          { cls: 'ag-m-perch-look', face: 'curious', dur: 1400, sfx: null, msg: 'Looking around' },
          { cls: 'ag-m-stretch-yawn', face: 'sleepy', dur: 1600, sfx: 'organic_purr', msg: 'Relaxing~' },
          { cls: 'ag-m-prompt-chirp', face: 'smile', dur: 600, sfx: 'haptic_switch', msg: 'Ready' }
        ];

        const pick = ambientMoves[Math.floor(Math.random() * ambientMoves.length)];
        setMascotMovement(pick.cls, pick.face, pick.dur, pick.sfx);
        if (Math.random() > 0.6) showMascotTempBubble(pick.msg, 1800);
      }, 10000);
    }

    function renderTelemetry(data) {
      if (!data) return;
      latestData = data;
      if (data.companion) {
        const incomingTyping = data.companion.typingAt || 0;
        if (incomingTyping > lastTypingSeenAt && (Date.now() - incomingTyping) < 3500) {
          lastTypingSeenAt = incomingTyping;
          if (companion.mascotBehavior !== 'sleep' && !isDragging) {
            setMascotMovement('ag-m-prompt-chirp', 'curious', 1200, 'haptic_switch');
            showMascotTempBubble('Typing...', 1800);
          }
        }
        companion = Object.assign({}, companion, data.companion);
        applyCompanionVisibility();
      }

      const agents = data.activeAgents || [];
      // Trigger Celebration & Callout on task completion
      if (lastAgentCount > 0 && agents.length === 0) {
        setMascotMovement('ag-m-done-celebrate', 'laugh', 1200, 'apple_pay_triumph');
        showTaskCompleteCallout();
      }
      lastAgentCount = agents.length;

      const isRunning = data.isAntigravityRunning !== false;
      const led = document.getElementById('notchLed');
      const statusTxt = document.getElementById('notchStatusText');
      const modelBadge = document.getElementById('notchModelBadge');
      const ctxBadge = document.getElementById('notchCtxBadge');
      if (ctxBadge) {
        if (data.contextWindow && data.contextWindow.isNearLimit) {
          ctxBadge.style.display = 'inline-flex';
          ctxBadge.innerText = 'CTX ' + data.contextWindow.percentFull + '%';
        } else {
          ctxBadge.style.display = 'none';
        }
      }

      if (!isRunning) {
        if (led) led.className = 'ag-notch-led offline';
        if (statusTxt) statusTxt.innerText = 'Antigravity';
        if (modelBadge) modelBadge.innerText = 'Offline';
      } else if (agents.length > 0) {
        const lead = agents[0];
        if (led) led.className = 'ag-notch-led';
        if (statusTxt) statusTxt.innerText = agents.length + ' Agent' + (agents.length > 1 ? 's' : '');
        if (modelBadge) modelBadge.innerText = lead.model || 'Gemini';
      } else {
        if (led) led.className = 'ag-notch-led idle';
        if (statusTxt) statusTxt.innerText = 'Antigravity';
        if (modelBadge) modelBadge.innerText = 'Idle';
      }

      const tb = data.timeBreakdown || (data.session && data.session.timeBreakdown) || {};
      const tokB = data.tokenBreakdown || (data.session && data.session.tokenBreakdown) || {};

      const h24 = document.getElementById('notchHrs24');
      const hAll = document.getElementById('notchHrsAll');
      const t24 = document.getElementById('notchTok24');
      const tAll = document.getElementById('notchTokAll');
      const menuHrs = document.getElementById('menuHrsBadge');

      const overallSecs = tb.overall || (data.session && data.session.lifetimeActiveSeconds) || 0;
      if (h24) h24.innerText = formatHours(tb.last24h || 0);
      if (hAll) hAll.innerText = formatHours(overallSecs);
      if (menuHrs) menuHrs.innerText = formatHours(overallSecs);

      const totTok = (data.session && data.session.tokens) ? data.session.tokens.totalTokens : 0;
      if (t24) t24.innerText = formatCompact((tokB.last24h && tokB.last24h.totalTokens) || totTok);
      if (tAll) tAll.innerText = formatCompact((tokB.overall && tokB.overall.totalTokens) || totTok);

      if (data.session && data.session.startedAt) {
        const elapsed = isRunning
          ? Math.max(0, Math.floor((Date.now() - Date.parse(data.session.startedAt)) / 1000))
          : 0;
        const timerEl = document.getElementById('notchTimerText');
        if (timerEl) timerEl.innerText = formatClock(elapsed);
      }

      syncMascotVisualState();
    }

    async function commandMascot(partial) {
      mascotMenu.classList.remove('open');
      if (typeof partial.notchEnabled === 'boolean' || typeof partial.mascotEnabled === 'boolean') {
        window.agMascotAudio.playMagneticDock();
      } else if (partial.mascotBehavior === 'sleep') {
        window.agMascotAudio.playIslandCollapse();
      } else {
        window.agMascotAudio.playHapticSwitch();
      }

      companion = Object.assign({}, companion, partial);
      applyCompanionVisibility();
      syncMascotVisualState();

      try {
        await fetch('http://127.0.0.1:41177/api/companion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(partial)
        });
      } catch {}
    }

    function toggleMascotFromNotch() {
      const next = companion.mascotEnabled === false ? true : false;
      commandMascot({ enabled: true, mascotEnabled: next });
    }

    function toggleNotchFromMascot() {
      const next = companion.notchEnabled === false ? true : false;
      commandMascot({ enabled: true, notchEnabled: next });
    }

    function disableNotchOnly() {
      commandMascot({ notchEnabled: false });
    }

    function disableMascotOnly() {
      commandMascot({ mascotEnabled: false });
    }

    function cycleDesktopCorner() {
      const order = ['bottom-right', 'bottom-left'];
      const cur = (companion.corner === 'bottom-left' || companion.corner === 'top-left') ? 'bottom-left' : 'bottom-right';
      const next = order[(order.indexOf(cur) + 1) % order.length];
      commandMascot({ corner: next, mascotBehavior: 'sit_corner' });
    }

    function toggleOverlaySfx() {
      commandMascot({ soundMuted: !companion.soundMuted });
    }

    function openMainDashboard() {
      mascotMenu.classList.remove('open');
      window.agMascotAudio.playHapticSwitch();
      if (bridge && typeof bridge.openDashboard === 'function') {
        bridge.openDashboard();
      } else {
        window.open('http://127.0.0.1:41177', '_blank');
      }
    }

    function toggleNotchExpand(e) {
      e.stopPropagation();
      const pill = document.getElementById('notchPill');
      const isExpanding = !pill.classList.contains('expanded');
      pill.classList.toggle('expanded');
      if (isExpanding) {
        window.agMascotAudio.playIslandExpand();
      } else {
        window.agMascotAudio.playIslandCollapse();
      }
    }

    if (bridge && typeof bridge.onCompanionCommand === 'function') {
      bridge.onCompanionCommand(function(nextComp) {
        companion = Object.assign({}, companion, nextComp);
        applyCompanionVisibility();
        syncMascotVisualState();
      });
    }

    function connectOverlayStream() {
      fetch('http://127.0.0.1:41177/api/overview')
        .then(function(r) { return r.json(); })
        .then(function(d) { renderTelemetry(d); })
        .catch(function() {});

      try {
        const es = new EventSource('http://127.0.0.1:41177/api/stream');
        es.onmessage = function(ev) {
          try { renderTelemetry(JSON.parse(ev.data)); } catch {}
        };
        es.onerror = function() {
          try { es.close(); } catch {}
          setTimeout(connectOverlayStream, 3000);
        };
      } catch {
        setTimeout(connectOverlayStream, 3000);
      }
    }

    applyCompanionVisibility();
    connectOverlayStream();
    startAmbientPetLife();
  </script>
</body>
</html>
